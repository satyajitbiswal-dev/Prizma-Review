<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrizmaReview Dashboard</title>
    <meta name="description" content="PrizmaReview Dashboard — Monitor your GitHub repositories, pull request reviews, and code quality metrics.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
        .font-heading { font-family: 'Montserrat', sans-serif; }
        .bg-grid {
            background-image: radial-gradient(rgba(99,102,241,0.06) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="h-full antialiased bg-[#0a0e1a] text-gray-100">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 border-b border-white/[0.06] bg-[#0d1120]/80 backdrop-blur-xl">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between">
                <!-- Logo -->
                <a href="{% url 'dashboard_home' %}" class="flex items-center gap-2.5 group">
                    <span class="text-2xl">🤖</span>
                    <span class="font-heading text-xl font-800 bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent group-hover:from-indigo-300 group-hover:to-violet-300 transition-all">
                        PrizmaReview
                    </span>
                </a>

                <!-- User Profile + Logout -->
                <div class="flex items-center gap-4">
                    {% if user.is_authenticated %}
                    <div class="flex items-center gap-3 bg-white/[0.04] border border-white/[0.06] rounded-full pl-1.5 pr-4 py-1.5">
                        {% if user.github_profile.avatar_url %}
                        <img src="{{ user.github_profile.avatar_url }}" 
                             alt="{{ user.username }}'s avatar" 
                             class="w-8 h-8 rounded-full ring-2 ring-indigo-500/30">
                        {% else %}
                        <div class="w-8 h-8 rounded-full bg-indigo-600/30 flex items-center justify-center text-sm font-bold text-indigo-300">
                            {{ user.username|first|upper }}
                        </div>
                        {% endif %}
                        <span class="text-sm font-medium text-gray-300">{{ user.username }}</span>
                    </div>
                    <a href="{% url 'logout' %}" id="logout-btn"
                       class="inline-flex items-center gap-1.5 rounded-lg bg-red-500/10 border border-red-500/20 px-3.5 py-2 text-xs font-semibold text-red-400 hover:bg-red-500/20 hover:text-red-300 transition-all duration-200">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        Logout
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="py-10 bg-grid min-h-[calc(100vh-4rem)]">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
