<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrizmaReview Dashboard</title>
    <meta name="description"
        content="PrizmaReview Dashboard — Monitor your GitHub repositories, pull request reviews, and code quality metrics.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            color: #e5e7eb;
        }

        .font-heading {
            font-family: 'Montserrat', sans-serif;
        }

        .bg-grid {
            background-image: radial-gradient(rgba(99, 102, 241, 0.06) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .avatar-fallback {
            display: none;
        }

        img.avatar-img[data-error="1"]+.avatar-fallback {
            display: flex;
        }

        img.avatar-img[data-error="1"] {
            display: none;
        }
    </style>
</head>

<body class="h-full antialiased bg-[#0a0e1a] text-gray-100 flex flex-col min-h-screen">

    <nav class="sticky top-0 z-50 border-b border-white/[0.06] bg-[#0d1120]/90 backdrop-blur-xl">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between">
                <a href="{% url 'dashboard_home' %}" class="flex items-center gap-2.5 group">
                    <span class="text-2xl" aria-hidden="true">🤖</span>
                    <span
                        class="font-heading text-xl font-800 bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">
                        PrizmaReview
                    </span>
                </a>

                <div class="flex items-center gap-4">
                    <a href="{{ prizmareview_docs_config_url }}" target="_blank" rel="noopener noreferrer"
                       class="hidden sm:inline-flex items-center gap-1.5 text-sm font-medium text-gray-400 hover:text-indigo-300 transition-colors">
                        <span aria-hidden="true">⚙️</span> Customize
                    </a>
                    
                    {% if user.is_authenticated %}
                    <div
                        class="flex items-center gap-3 bg-white/[0.05] border border-white/[0.08] rounded-full pl-1.5 pr-4 py-1.5">


                        <div class="relative w-8 h-8 shrink-0">
                            {% if github_avatar_url %}
                            <img src="{{ github_avatar_url }}" alt="" referrerpolicy="no-referrer"
                                class="avatar-img absolute inset-0 z-10 w-8 h-8 rounded-full ring-2 ring-indigo-500/40 object-cover bg-indigo-900/40"
                                onerror="this.remove();">
                            {% endif %}


                            <div
                                class="avatar-fallback w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-sm font-bold text-white">
                                {{ github_display_name|first|upper }}
                            </div>
                        </div>

                        <span class="text-sm font-medium text-gray-200">{{ github_display_name }}</span>
                    </div>

                    <a href="{% url 'logout' %}"
                        class="inline-flex items-center gap-1.5 rounded-lg bg-red-500/10 border border-red-500/25 px-3.5 py-2 text-sm font-semibold text-red-300 hover:bg-red-500/20 transition-colors">
                        Logout
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 py-10 bg-grid">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="border-t border-white/[0.06] bg-[#0d1120]/60 py-6">
        <div class="mx-auto max-w-7xl px-4 text-center space-y-2">
            <p class="text-sm text-gray-400">
                Built with care by the <span class="text-indigo-300 font-medium">PrizmaReview</span> team.
            </p>
            <p class="text-sm text-gray-500">
                <a href="{{ prizmareview_repo_url }}" target="_blank" rel="noopener noreferrer"
                       class="hidden sm:inline-flex items-center gap-1.5 text-sm font-medium text-gray-400 hover:text-indigo-300 transition-colors">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"/></svg>
                        GitHub
                </a>
            </p>
        </div>
    </footer>

</body>

</html>
